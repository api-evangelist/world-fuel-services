description: >-
  World Fuel Services, which rebranded as World Kinect Corporation in 2023, is a Miami-based
  Fortune 100 global energy management company that supplies fuel, energy and related products
  and services across three segments — aviation, marine and land. It sells and distributes
  jet fuel, marine bunker fuel, diesel, gasoline, natural gas, power, lubricants and renewable
  fuels to airlines, business aviation operators, airports and FBOs, shipping fleets and ports,
  commercial and industrial customers, government and military accounts, and retail petroleum
  networks in more than 200 countries and territories. Its technology brands include the
  myWorld aviation portal and app, Trip View, AVCARD and EPIC fuel cards, the World Kinect
  Online energy portal, and the trip-support business acquired from Universal Weather and
  Aviation in 2024. Digital delivery is customer-portal-first: integrations such as fuel-price
  feeds into flight-planning platforms are arranged commercially rather than through a public
  developer program.
