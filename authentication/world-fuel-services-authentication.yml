  - implicit
  - urn:ietf:params:oauth:grant-type:device_code
  - urn:ietf:params:oauth:grant-type:token-exchange
  - urn:ietf:params:oauth:grant-type:jwt-bearer
  response_types:
  - code
  - token
  - id_token
  - code token
  - code id_token
  - token id_token
  - code token id_token
  pkce:
    supported: true
    code_challenge_methods:
    - S256
    - plain
  token_endpoint_auth_methods:
  - client_secret_basic
  - client_secret_post
  - private_key_jwt
  - none
  id_token_signing_algs:
  - HS256
  - RS256
  - PS256
  dpop_signing_algs:
  - ES256
  mfa:
    supported: true
    evidence: mfa_challenge_endpoint and the mfa-oob / mfa-otp / mfa-recovery-code grant types.
  logout:
    backchannel_logout_supported: true
    backchannel_logout_session_supported: true
  observations:
  - The `implicit` and `password` (ROPC) grants are still advertised alongside
    authorization_code + PKCE; both are discouraged by OAuth 2.1.
  - '`plain` remains in code_challenge_methods_supported next to S256.'
  - HS256 is advertised for id_token signing alongside RS256/PS256.
  - No custom API scopes appear in scopes_supported — only the OIDC/profile set.
onboarding:
  self_service: false
  path: https://www.world-kinect.com/about-us/contact-us/portal-access-form
  note: >-
    Portal access is requested through a form; there is no public API key issuance, no
    documented client-credentials onboarding, and no published developer terms.
