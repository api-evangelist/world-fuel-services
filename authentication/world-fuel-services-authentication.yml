generated: '2026-08-29'
method: probed
source: https://auth.wfscorp.com/.well-known/openid-configuration
note: >-
  World Kinect publishes no public developer program and no OpenAPI, so there are no
  securitySchemes to derive from. What it DOES publish anonymously is a full OpenID Connect
  Discovery document on auth.wfscorp.com — the Auth0-backed identity host that the myWorld
  customer portal (myworld.wfscorp.com) authenticates against. Everything below is read
  verbatim from that document; nothing is inferred. Access to the APIs the portal calls is
  still gated: the tenant issues tokens only to registered clients, and a customer requests
  portal access through a sales form rather than self-service signup.
domain_ownership: >-
  wfscorp.com is World Kinect Corporation's own legacy corporate domain — it 301s to
  www.world-kinect.com and the myWorld portal SPA served from myworld.wfscorp.com names
  auth.wfscorp.com as its issuer in its published JavaScript bundle.
schemes:
- id: openid-connect
  type: openIdConnect
  openIdConnectUrl: https://auth.wfscorp.com/.well-known/openid-configuration
  issuer: https://auth.wfscorp.com/
  platform: Auth0 (custom domain)
  endpoints:
    authorization: https://auth.wfscorp.com/authorize
    token: https://auth.wfscorp.com/oauth/token
    userinfo: https://auth.wfscorp.com/userinfo
    jwks: https://auth.wfscorp.com/.well-known/jwks.json
    revocation: https://auth.wfscorp.com/oauth/revoke
    device_authorization: https://auth.wfscorp.com/oauth/device/code
    backchannel_authentication: https://auth.wfscorp.com/bc-authorize
    dynamic_registration: https://auth.wfscorp.com/oidc/register
    mfa_challenge: https://auth.wfscorp.com/mfa/challenge
  grant_types:
  - authorization_code
  - client_credentials
  - refresh_token
